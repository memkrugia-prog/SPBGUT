<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Домашка — StudyСПб</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;background:#FAF8F5;color:#2D2A32;margin:0;padding:24px 16px 80px}
.wrap{max-width:640px;margin:0 auto}
h1{font-family:'Manrope';font-size:26px;font-weight:800;color:#6D28D9;margin:0 0 6px}
.sub{color:#9C95A7;font-size:13px;margin-bottom:22px}
.card{background:#fff;border-radius:16px;padding:20px;border:1px solid rgba(124,58,237,.08);box-shadow:0 2px 16px rgba(124,58,237,.07);margin-bottom:14px}
.en{font-family:'Manrope';font-size:24px;font-weight:800;color:#6D28D9}
.ru{font-size:16px;font-weight:600;margin-top:6px}
.note{font-size:13px;color:#6B6572;background:#F5F0E8;border-radius:10px;padding:10px 12px;margin-top:10px}
.syn{font-size:12px;color:#9C95A7;font-style:italic;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 20px;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;margin-top:12px}
.bp{background:linear-gradient(135deg,#7C3AED,#8B5CF6);color:#fff}
.bs{background:#fff;color:#7C3AED;border:1.5px solid #EDE9FE}
.due{font-size:12px;color:#F59E0B;margin-top:8px}
.due.late{color:#EF4444;font-weight:700}
input{width:100%;padding:14px;border:2px solid #EDE5D8;border-radius:12px;font-size:16px;outline:none;box-sizing:border-box}
input:focus{border-color:#A78BFA}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:14px;display:none}
.fb.ok{display:block;background:#ECFDF5;color:#10B981}
.fb.no{display:block;background:#FEF2F2;color:#EF4444}
h2{font-family:'Manrope';font-size:18px;font-weight:800;margin:26px 0 12px}
.done{text-align:center;color:#10B981;font-weight:700;padding:30px}
a.home{color:#7C3AED;font-size:13px;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
<a class="home" href="/">← на сайт</a>
<h1>📚 Домашка</h1>
<div class="sub">Слова, которые ты не знал на карточках. Сначала выучи в справочнике, потом тест БЕЗ подсказок. Просрочил дедлайн — −100 рейтинга.</div>
<div id="learn"></div>
<h2 id="testTitle" style="display:none">✍️ Тест (без подсказок)</h2>
<div id="test"></div>
</div>
<script>
let HW=[],learnQ=[],testQ=[],ti=0,answered=false;
const $=id=>document.getElementById(id);
const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};
const norm=s=>(s||'').toLowerCase().replace(/[.,!?;:()«»"'\/\-–—]/g,' ').replace(/\s+/g,' ').trim();
async function api(u,o={}){const r=await fetch(u,{headers:{'Content-Type':'application/json'},credentials:'include',...o});if(r.status===401){location.href='/';throw 0}return r}
function fmtDue(d){const ms=new Date(d)-Date.now();if(ms<=0)return '⚠️ просрочено — штраф −100!';return 'дедлайн через '+Math.floor(ms/36e5)+' ч'}
async function load(){
  HW=await (await api('/api/homework')).json();
  learnQ=HW.filter(x=>x.stage===0);
  testQ=HW.filter(x=>x.stage===1);
  renderLearn(); showTest();
}
function renderLearn(){
  $('learn').innerHTML = learnQ.length ? '<h2>📖 Справочник — выучи ('+learnQ.length+')</h2>'+learnQ.map((w,i)=>
   '<div class="card"><div class="en">'+esc(w.en)+'</div><div class="ru">'+esc(w.ru)+'</div>'+
   (w.synonyms?'<div class="syn">≈ '+esc(w.synonyms)+'</div>':'')+
   (w.note?'<div class="note">⚡ '+esc(w.note)+'</div>':'')+
   '<div class="due '+(new Date(w.due_at)<new Date()?'late':'')+'">'+fmtDue(w.due_at)+'</div>'+
   '<div style="display:flex;gap:10px"><button class="btn bp" onclick="toTest('+i+')">✓ Выучено — к тесту</button>'+
   '<button class="btn bs" onclick="postpone('+w.word_id+')">⏰ Отложить 24ч</button></div></div>').join('') : '';
}
async function toTest(i){
  const w=learnQ[i];
  await api('/api/homework/'+w.word_id+'/viewed',{method:'POST'});
  w.stage=1; learnQ.splice(i,1); testQ.push(w);
  renderLearn(); showTest();
}
function showTest(){
  answered=false;
  if(!testQ.length){ $('testTitle').style.display='none';
    $('test').innerHTML = learnQ.length ? '' : '<div class="done">🎉 Все задания выполнены!</div>';
    return; }
  $('testTitle').style.display='';
  const w=testQ[ti];
  $('test').innerHTML='<div class="card"><div style="color:#9C95A7;font-size:12px;margin-bottom:8px">Слово '+(ti+1)+' из '+testQ.length+' · переведи на русский</div>'+
   '<div class="en">'+esc(w.en)+'</div>'+
   '<input id="ans" placeholder="Твой перевод..." onkeydown="if(event.key===\'Enter\')check()">'+
   '<div class="fb" id="fb"></div>'+
   '<div style="display:flex;gap:10px"><button class="btn bp" onclick="check()">Проверить</button>'+
   '<button class="btn bs" onclick="postpone('+w.word_id+')">⏰ Отложить 24ч</button></div></div>';
  setTimeout(()=>{const a=$('ans');if(a)a.focus()},50);
}
async function check(){
  if(answered)return; const w=testQ[ti], u=$('ans').value.trim(); if(!u)return $('ans').focus();
  answered=true;
  let ok=false, correct=w.ru;
  const r=await api('/api/homework/test',{method:'POST',body:JSON.stringify({word_id:w.word_id,answer:u})});
  if(r.ok){ const j=await r.json(); ok=j.ok; correct=j.correct||w.ru; }
  else {
    const us=norm(u); const all=[w.ru,(w.synonyms||'')].join(',').split(/[\/,]/).map(norm).filter(Boolean);
    ok=all.some(v=>us===v||us.includes(v)||v.includes(us));
    await api('/api/answer',{method:'POST',body:JSON.stringify({word_id:w.word_id,mode:'homework',correct:ok,source:'card'})});
  }
  const fb=$('fb');
  if(ok){ fb.className='fb ok'; fb.innerHTML='✓ Верно! Слово закрыто.';
    setTimeout(()=>{ testQ.splice(ti,1); if(ti>=testQ.length)ti=0; showTest(); },900);
  } else { fb.className='fb no'; fb.innerHTML='✗ Неверно. Правильно: <b>'+esc(correct)+'</b>';
    setTimeout(()=>{ testQ.push(testQ.splice(ti,1)[0]); showTest(); },2500);
  }
}
async function postpone(id){
  const r=await api('/api/homework/'+id+'/postpone',{method:'POST'});
  const j=await r.json().catch(()=>({}));
  alert(r.ok?('Отложено на 24ч. Осталось откладываний: '+(j.postponesLeft!=null?j.postponesLeft:'—')):(j.error||'Нельзя отложить'));
  load();
}
load();
</script>
</body>
</html>
